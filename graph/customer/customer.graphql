input InputCustomer {
  name: String
  email: String!
  phone: String
  address: String
  grossSalary: Float
}

type Customer {
  name: String
  email: String
  phone: String
  address: String
  grossSalary: Float
}

type Mutation {
  addCustomer(customer: InputCustomer!): [Customer]
  removeCustomer(email: String!): [Customer]
}

type Query {
  getCustomersList: [Customer]
  getCustomer(email: String!): Customer
}
