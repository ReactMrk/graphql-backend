input InputCustomer {
  name: String
  email: String!
  phone: String
  address: String
  grossSalary: Float
}

type Customer {
  name: String
  email: String
  phone: String
  address: String
  grossSalary: Float
}

type Mutation {
  addCustomer(customer: InputCustomer): [Customer]
}

type Query {
  getCustomer(email: String): Customer
}
